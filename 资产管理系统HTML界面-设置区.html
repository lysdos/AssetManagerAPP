<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFID功率设置 - UI设计稿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #fff;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            border: 8px solid #1a1a1a;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            background: #1976D2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-size: 14px;
        }

        .status-bar .time { font-weight: 600; }
        .status-bar .icons { display: flex; gap: 5px; }

        /* Toolbar */
        .toolbar {
            height: 56px;
            background: #1976D2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            color: white;
        }

        .toolbar-title {
            font-size: 20px;
            font-weight: 500;
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
        }

        .toolbar-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .toolbar-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .toolbar-btn svg {
            width: 24px;
            height: 24px;
        }

        /* 内容区域 */
        .content {
            flex: 1;
            background: #f5f5f5;
            padding: 16px;
            height: calc(100% - 44px - 56px - 56px);
            overflow-y: auto;
        }

        /* 扫描页面内容 */
        .scan-area {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .scan-area h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 16px;
        }

        .scan-frame {
            width: 100%;
            height: 200px;
            background: #e3f2fd;
            border: 2px dashed #1976D2;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1976D2;
            font-size: 14px;
        }

        .scan-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .stat-item {
            text-align: center;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #1976D2;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        /* 底部导航 */
        .bottom-nav {
            height: 56px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid #e0e0e0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 16px;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            color: #666;
        }

        .nav-item span {
            font-size: 11px;
            color: #666;
        }

        .nav-item.active svg {
            color: #1976D2;
        }

        .nav-item.active span {
            color: #1976D2;
            font-weight: 500;
        }

        /* 设置对话框 */
        .dialog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .dialog-overlay.show {
            display: flex;
        }

        .dialog {
            width: 320px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .dialog-header {
            background: #1976D2;
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dialog-header h3 {
            font-size: 18px;
            font-weight: 500;
        }

        .dialog-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dialog-body {
            padding: 24px 20px;
        }

        .power-display {
            text-align: center;
            margin-bottom: 24px;
        }

        .power-value {
            font-size: 48px;
            font-weight: 700;
            color: #1976D2;
        }

        .power-unit {
            font-size: 16px;
            color: #666;
            margin-left: 4px;
        }

        .power-label {
            font-size: 14px;
            color: #999;
            margin-top: 4px;
        }

        .power-slider-container {
            margin-bottom: 24px;
        }

        .power-slider-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .power-slider-labels span {
            font-size: 12px;
            color: #999;
        }

        .power-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #e3f2fd, #1976D2);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .power-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #1976D2;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .power-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #1976D2;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .power-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .preset-btn {
            padding: 10px 8px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            border-color: #1976D2;
            color: #1976D2;
        }

        .preset-btn.active {
            background: #1976D2;
            border-color: #1976D2;
            color: white;
        }

        .power-info {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .power-info p {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .dialog-footer {
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }

        .dialog-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dialog-btn.cancel {
            background: #f5f5f5;
            color: #666;
        }

        .dialog-btn.cancel:hover {
            background: #e0e0e0;
        }

        .dialog-btn.confirm {
            background: #1976D2;
            color: white;
        }

        .dialog-btn.confirm:hover {
            background: #1565C0;
        }

        /* 标注 */
        .annotation {
            position: absolute;
            background: #4CAF50;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            z-index: 70;
        }

        .annotation-1 {
            top: 65px;
            right: 80px;
        }

        .annotation-2 {
            top: 320px;
            left: 20px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <span class="toolbar-title">华夏固资盘点</span>
            <div class="toolbar-actions">
                <button class="toolbar-btn" id="settingsBtn" onclick="toggleDialog()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 标注1 -->
        <div class="annotation annotation-1">齿轮图标 - 功率设置入口</div>

        <!-- 内容区域 -->
        <div class="content">
            <div class="scan-area">
                <h3>RFID扫描</h3>
                <div class="scan-frame">
                    <span>📷 扫描区域</span>
                </div>
                <div class="scan-stats">
                    <div class="stat-item">
                        <div class="stat-value">128</div>
                        <div class="stat-label">已扫描</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">45</div>
                        <div class="stat-label">匹配成功</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">83</div>
                        <div class="stat-label">待确认</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 标注2 -->
        <div class="annotation annotation-2">当前功率: 26dBm</div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>导入</span>
            </div>
            <div class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <span>扫描</span>
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span>结果</span>
            </div>
        </div>

        <!-- 设置对话框 -->
        <div class="dialog-overlay" id="dialogOverlay" onclick="toggleDialog()">
            <div class="dialog" onclick="event.stopPropagation()">
                <div class="dialog-header">
                    <h3>功率设置</h3>
                    <button class="dialog-close" onclick="toggleDialog()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div class="dialog-body">
                    <div class="power-display">
                        <span class="power-value" id="powerValue">26</span>
                        <span class="power-unit">dBm</span>
                        <div class="power-label">当前读写器功率</div>
                    </div>

                    <div class="power-slider-container">
                        <div class="power-slider-labels">
                            <span>0 dBm (低)</span>
                            <span>30 dBm (高)</span>
                        </div>
                        <input type="range" class="power-slider" id="powerSlider" min="0" max="30" value="26" oninput="updatePower(this.value)">
                    </div>

                    <div class="power-presets">
                        <button class="preset-btn" onclick="setPreset(5)">5 dBm</button>
                        <button class="preset-btn" onclick="setPreset(15)">15 dBm</button>
                        <button class="preset-btn" onclick="setPreset(26)">26 dBm</button>
                        <button class="preset-btn active" onclick="setPreset(30)">30 dBm</button>
                    </div>

                    <div class="power-info">
                        <p><strong>功率说明：</strong><br>
                        • 低功率(0-10dBm)：近距离扫描，约0.5米<br>
                        • 中功率(11-20dBm)：中距离扫描，约2米<br>
                        • 高功率(21-30dBm)：远距离扫描，约5-8米</p>
                    </div>
                </div>
                <div class="dialog-footer">
                    <button class="dialog-btn cancel" onclick="toggleDialog()">取消</button>
                    <button class="dialog-btn confirm" onclick="savePower()">保存设置</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleDialog() {
            const overlay = document.getElementById('dialogOverlay');
            overlay.classList.toggle('show');
        }

        function updatePower(value) {
            document.getElementById('powerValue').textContent = value;
            // 更新预设按钮状态
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === value + ' dBm') {
                    btn.classList.add('active');
                }
            });
        }

        function setPreset(value) {
            document.getElementById('powerSlider').value = value;
            updatePower(value);
        }

        function savePower() {
            const power = document.getElementById('powerValue').textContent;
            alert('功率已设置为 ' + power + ' dBm');
            toggleDialog();
        }
    </script>
</body>
</html>
