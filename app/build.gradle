plugins {
    id 'com.android.application'
}

// 从 local.properties 读 release 签名; 任一字段缺失返回 null。
static def loadSigningProps(File rootDir) {
    File propsFile = new File(rootDir, 'local.properties')
    if (!propsFile.exists()) return null
    Properties p = new Properties()
    propsFile.withInputStream { p.load(it) }
    String storeFile = p.getProperty('RELEASE_STORE_FILE')
    String storePassword = p.getProperty('RELEASE_STORE_PASSWORD')
    String keyAlias = p.getProperty('RELEASE_KEY_ALIAS')
    String keyPassword = p.getProperty('RELEASE_KEY_PASSWORD')
    if (!storeFile || !storePassword || !keyAlias || !keyPassword) return null
    return [storeFile: storeFile, storePassword: storePassword,
            keyAlias: keyAlias, keyPassword: keyPassword]
}

static boolean hasSigningProps(File rootDir) {
    return loadSigningProps(rootDir) != null
}

android {
    namespace 'com.huaxia.inventory'
    compileSdk 34

    // AGP 8.0+ 默认不为 application module 生成 BuildConfig 类;
    // 显式开启, 让 com.huaxia.inventory.BuildConfig 在源码里能引用到.
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        // 通用版「资产管家」使用独立包名, 与客户定制版 com.huaxia.inventory 并存安装.
        // 包名一旦发布不可再改 (改动等于换一个 App, 设备数据不迁移).
        applicationId "com.assetmanager.inventory"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        // release 凭据从 local.properties 读取. 为方便乙方 clone 后直接 assembleRelease,
        // local.properties + app/keystore/dev.jks 当前已 git 跟踪 (交付包的一部分),
        // 凭据覆盖风险依赖外部分发管控 (zip+单独渠道) 与仓库的 private/visibility.
        // 任一字段缺失或整文件不存在时 assembleRelease 回退到 debug 签名并打印告警.
        release {
            def props = loadSigningProps(rootDir)
            storeFile props != null
                    ? rootProject.file(props.storeFile)
                    : file('keystore/dev.jks')
            if (props != null) {
                storePassword props.storePassword
                keyAlias props.keyAlias
                keyPassword props.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            // debug 不开 R8: 让堆栈与 IDE 调试可直接读类名/方法名, 排查时不再受混淆干扰.
            minifyEnabled false
        }
        release {
            // release 开 R8: 默认 proguard-android-optimize + proguard-rules.pro.
            // proguard-rules.pro 中保留了 android.device.* / com.ubx.usdk.* 等
            // 可能被 R8 误剥的 SDK 类，兜底 ScanManager 与 RFID 的反射调用入口。
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningProps(rootDir)) {
                signingConfig signingConfigs.release
            } else {
                // 回退到 debug 签名并打印告警 — assembleDebug 始终正常.
                println("⚠️ release 未配置签名凭据 — 回退到 debug 签名. " +
                        "请填写 local.properties 中 RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD / " +
                        "RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD 后重新构建.")
                signingConfig signingConfigs.debug
            }
        }
    }

    packagingOptions {
        resources {
            // log4j-api / log4j-core 都带构建期元数据, AGP 默认拒绝重复资源路径
            // 运行时用不到, pickFirst 保留一份即可 (比 excludes 安全)
            pickFirsts += ['META-INF/DEPENDENCIES']
        }
    }

    testOptions {
        unitTests {
            // 让 ExcelImporter / ImportViewModel 里加的 Log.i/w/e 调用在 JVM 测试
            // 下返回 0 而不是抛 "not mocked" — Robolectric 测试不受影响
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    // 引入 lifecycle-process 拿到 ProcessLifecycleOwner, 让 MainActivity
    // 能监听"应用真进后台"事件 (区别于 Activity.onStop 的瞬时),
    // 避免短离场 (权限弹窗/系统对话框) 误触发 RFID powerOff.
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.activity:activity:1.8.2'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    // POI 5 把 log4j 改成 optional; 不加 log4j-core 时 ProviderUtil 会走
    // java.util.ServiceLoader 路径 (LambdaMetafactory.metafactory), Android ART 不支持,
    // 抛 NoSuchMethodError 导致 XSSFWorkbook 构造失败. log4j-core 自带
    // META-INF/log4j-provider.properties, ProviderUtil 走 properties 路径不触发 lambda.
    implementation 'org.apache.logging.log4j:log4j-core:2.21.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // 优博讯平台 SDK — 条码 ScanManager / DeviceManager 等平台能力 (android.device.*)
    implementation files('libs/platform_sdk_v4.1.0326.jar')
    // 优博讯 UHF 读写器 SDK — com.ubx.usdk.*, 自带 arm64-v8a / armeabi-v7a / armeabi 的 .so
    implementation files('libs/URFIDLibrary-v2.5.0718.aar')
    // 旧「成为」(rscja) SDK — Task 5 摘除
    implementation files('libs/DeviceAPI_ver20230301_release.aar')

    // 手动盘点页的降级扫码方案：摄像头预览 + ML Kit 条码识别
    // (用于没有物理扫码枪或暂不接 rscja barcode SDK 的场景)
    def cameraxVersion = "1.3.4"
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"
    // bundled 模型: 不依赖 Google Play Services, 国内可直接用
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.25.1'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.mockito:mockito-core:5.7.0'
}
